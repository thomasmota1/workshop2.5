name: CI - Pipeline de Integração Contínua

# Gatilhos: quando o workflow deve rodar
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # permite rodar manualmente pela aba Actions

jobs:
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      # Passo 1: baixa o código do repositório para o runner
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: instala o Python na versão especificada
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Passo 3: instala as dependências do projeto
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Passo 4: verifica qualidade/estilo do código
      - name: Lint com flake8
        run: |
          flake8 src/ tests/ --max-line-length=100

      # Passo 5: executa os testes automatizados com o PYTHONPATH configurado
      - name: Rodar testes
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v
